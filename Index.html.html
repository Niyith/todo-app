<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --surface:#FFFFFF; --ink:#16212C; --muted:#5C6B7A; --line:#D3DCE5;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --done:#8A97A4; --danger:#B4332E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#18222C; --ink:#E8EEF4; --muted:#93A2B1; --line:#2A3846;
    --accent:#3FB8C4; --accent-ink:#0B1218; --done:#6C7B89; --danger:#F08A84; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#18222C; --ink:#E8EEF4; --muted:#93A2B1; --line:#2A3846;
  --accent:#3FB8C4; --accent-ink:#0B1218; --done:#6C7B89; --danger:#F08A84; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
form{display:flex;gap:8px;margin-bottom:18px}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font-weight:600}
.filters{display:flex;gap:6px;margin-bottom:14px}
.filters button{background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.92rem}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--accent-ink);display:grid;place-items:center;padding:0}
li.done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:14px;height:14px;opacity:0}
li.done .check svg{opacity:1}
.text{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;padding:2px 0;overflow-wrap:anywhere}
li.done .text{color:var(--done);text-decoration:line-through}
li input[type=text]{padding:6px 10px}
.del{flex:none;background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:8px}
.del:hover{color:var(--danger)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.92rem}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.clear:hover{color:var(--danger)}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p class="sub" id="sub"></p>
  <div class="progress" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" id="bar"><span id="fill"></span></div>
  <form id="form">
    <input type="text" id="new" placeholder="Add a task" maxlength="200" autocomplete="off" aria-label="New task">
    <button class="add" type="submit">Add task</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button class="clear" id="clear">Clear completed</button>
  </footer>
</main>
<script>
(function(){
  var KEY="todo-tasks-v1", tasks=[], filter="all", editing=null;
  try{ var s=localStorage.getItem(KEY); if(s) tasks=JSON.parse(s)||[]; }catch(e){ tasks=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  var $=function(id){return document.getElementById(id)};
  var list=$("list");
  var CHECK='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';

  function render(){
    var done=tasks.filter(function(t){return t.done}).length, total=tasks.length;
    var pct=total?Math.round(done/total*100):0;
    $("fill").style.width=pct+"%"; $("bar").setAttribute("aria-valuenow",pct);
    $("sub").textContent=total?(done+" of "+total+" done"):"Nothing here yet";
    $("count").textContent=(total-done)+" left";
    $("clear").style.display=done?"":"none";
    document.querySelectorAll("#filters button").forEach(function(b){
      b.setAttribute("aria-pressed",String(b.dataset.f===filter));
    });
    var shown=tasks.filter(function(t){
      return filter==="all"||(filter==="done"?t.done:!t.done);
    });
    list.innerHTML="";
    if(!shown.length){
      var e=document.createElement("li"); e.className="empty";
      e.textContent=total?"No "+filter+" tasks.":"Add your first task above.";
      list.appendChild(e); return;
    }
    shown.forEach(function(t){
      var li=document.createElement("li"); if(t.done) li.className="done";
      var c=document.createElement("button"); c.className="check"; c.innerHTML=CHECK;
      c.setAttribute("aria-label",(t.done?"Mark not done: ":"Mark done: ")+t.text);
      c.onclick=function(){ t.done=!t.done; save(); render(); };
      li.appendChild(c);
      if(editing===t.id){
        var inp=document.createElement("input"); inp.type="text"; inp.value=t.text; inp.maxLength=200;
        inp.setAttribute("aria-label","Edit task");
        var commit=function(){ var v=inp.value.trim(); if(v) t.text=v; editing=null; save(); render(); };
        inp.onkeydown=function(ev){ if(ev.key==="Enter") commit(); if(ev.key==="Escape"){editing=null;render();} };
        inp.onblur=commit;
        li.appendChild(inp); setTimeout(function(){inp.focus();inp.select();},0);
      }else{
        var tx=document.createElement("button"); tx.className="text"; tx.textContent=t.text;
        tx.title="Edit task"; tx.onclick=function(){ editing=t.id; render(); };
        li.appendChild(tx);
      }
      var d=document.createElement("button"); d.className="del"; d.textContent="\u00D7";
      d.setAttribute("aria-label","Delete task: "+t.text);
      d.onclick=function(){ tasks=tasks.filter(function(x){return x.id!==t.id}); save(); render(); };
      li.appendChild(d);
      list.appendChild(li);
    });
  }

  $("form").onsubmit=function(ev){
    ev.preventDefault();
    var v=$("new").value.trim(); if(!v) return;
    tasks.unshift({id:Date.now()+Math.random(),text:v,done:false});
    $("new").value=""; save(); render();
  };
  $("filters").onclick=function(ev){
    var f=ev.target.dataset&&ev.target.dataset.f; if(f){ filter=f; render(); }
  };
  $("clear").onclick=function(){ tasks=tasks.filter(function(t){return !t.done}); save(); render(); };
  render();
})();
</script>
</body>
</html>
